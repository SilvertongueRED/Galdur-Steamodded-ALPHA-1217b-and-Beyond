name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version manifest.json)
          mkdir -p /tmp/pkg/Galdur
          git archive HEAD | tar -x -C /tmp/pkg/Galdur
          rm -rf /tmp/pkg/Galdur/.github /tmp/pkg/Galdur/release-notes
          (cd /tmp/pkg && zip -r "$GITHUB_WORKSPACE/Galdur-v$VERSION.zip" Galdur)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "Galdur-v$VERSION.zip" --clobber
          else
            gh release create "v$VERSION" "Galdur-v$VERSION.zip" --target "$GITHUB_SHA" --title "Galdur v$VERSION" --notes-file "release-notes/v$VERSION.md"
          fi
